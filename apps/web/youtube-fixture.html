<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YouTube Player Subtitle Fixture — LexiStream</title>
    <style>
      body {
        margin: 0;
        background: #090d16;
        color: #f8fafc;
        font-family: system-ui, -apple-system, sans-serif;
        padding: 24px;
      }
      .fixture-layout {
        max-width: 860px;
        margin: 0 auto;
      }
      .html5-video-player {
        position: relative;
        width: 100%;
        height: 420px;
        background: linear-gradient(160deg, #0f172a, #1e293b);
        border-radius: 12px;
        overflow: hidden;
        border: 1px solid #334155;
      }
      .playback-hud {
        position: absolute;
        top: 12px;
        left: 12px;
        display: flex;
        align-items: center;
        gap: 8px;
        z-index: 20;
      }
      .playback-badge {
        font-size: 12px;
        font-weight: 700;
        padding: 5px 10px;
        border-radius: 999px;
        background: rgba(15, 23, 42, 0.85);
        border: 1px solid #475569;
        color: #cbd5e1;
      }
      .playback-badge[data-playing="true"] {
        border-color: #34d399;
        color: #34d399;
      }
      .playback-badge[data-playing="false"] {
        border-color: #fbbf24;
        color: #fbbf24;
      }
      .controls-bar {
        display: flex;
        gap: 8px;
        margin-top: 14px;
        flex-wrap: wrap;
      }
      button {
        background: #1e293b;
        color: #f8fafc;
        border: 1px solid #475569;
        border-radius: 7px;
        padding: 8px 12px;
        cursor: pointer;
        font-weight: 600;
      }
      button:hover {
        background: #334155;
      }
    </style>
  </head>
  <body>
    <div class="fixture-layout">
      <h1 class="ytd-watch-metadata">
        <yt-formatted-string>How Contextual Input Accelerates Language Acquisition</yt-formatted-string>
      </h1>
      <div id="movie_player" class="html5-video-player">
        <video class="html5-main-video"></video>
        <div class="playback-hud">
          <button id="play-pause-btn" type="button">▶ Play Video</button>
          <span id="playback-status" class="playback-badge" data-playing="false">
            ⏸ PAUSED · 125.4s
          </span>
        </div>
        <button
          id="cc-toggle"
          class="ytp-subtitles-button"
          aria-pressed="true"
          style="position: absolute; top: 12px; right: 12px"
        >
          CC: ON
        </button>
        <div class="ytp-caption-window-container">
          <span class="ytp-caption-segment" id="cue-segment">I never thought this would happen.</span>
        </div>
      </div>

      <div class="controls-bar">
        <button id="cue-1" type="button">Cue 1: Verb "thought"</button>
        <button id="cue-2" type="button">Cue 2: Noun "thought" &amp; River "bank"</button>
        <button id="cue-3" type="button">Cue 3: Phrasal Verb "give up"</button>
        <button id="cue-4" type="button">Cue 4 (FR): "Aujourd'hui, ce petit territoire souverain et indépendant"</button>
        <button id="cue-5" type="button">Cue 5 (FR): "Cette île est appelée Formosa."</button>
        <button id="cue-off" type="button">Toggle Captions Off/On</button>
        <a href="/" style="color: #38bdf8; align-self: center; margin-left: auto">
          Go to Study Dashboard →
        </a>
      </div>
    </div>
    <script type="module" src="/src/youtube-fixture.ts"></script>
  </body>
</html>

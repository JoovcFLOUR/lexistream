[package]
name = "lexistream-language-wasm"
version = "0.1.0"
edition = "2021"
description = "Experimental Rust/WebAssembly subtitle tokenizer and normalizer evaluated against TypeScript"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "tokenizer_bench"
harness = false
